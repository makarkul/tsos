name: CI

# Runs the same health check every contributor runs locally: `npm run build`
# (TypeScript in strict mode + the Vite bundler). Green means a contribution is
# safe to merge, so reviewing a PR is mostly "is CI green?" — not the mentor
# reading every line.
#
# It runs on every push to any branch (so you see green/red on your own branch
# before you even open a PR) and on every pull request.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
